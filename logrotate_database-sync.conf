# Logrotate configuration for Database Sync logs
# Place this file in /etc/logrotate.d/ (requires root) or include it in your logrotate setup.
# Rotates the log daily and keeps 7 days of history.

/home/clodomilson/Documentos/devops/database-sync/logs/database-sync.log {
    daily               # rotate every 24h
    rotate 7            # keep last 7 days
    compress            # gzip old logs
    missingok
    notifempty
    copytruncate        # truncate original after copying, keeping the running process happy
}
